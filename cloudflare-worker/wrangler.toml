# Configuração de deploy do Worker.
#
# Existe por um motivo concreto: `wrangler deploy` publica exatamente o que este
# arquivo declara. Sem o bloco [[d1_databases]] abaixo, o deploy REMOVERIA o
# binding POKER_DB que foi criado pelo painel, e a votação pararia de funcionar.
#
# Os SECRETS (GH_TOKEN, ADMIN_SENHA, DEV_SENHA) NÃO entram aqui de propósito:
# secrets são gerenciados à parte e sobrevivem ao deploy. Declará-los como [vars]
# os transformaria em texto puro e sobrescreveria os que já existem.

name = "roadmap-nova-melhoria"
main = "worker.js"
compatibility_date = "2025-01-01"

# ── NAO PONHA `[limits] cpu_ms` AQUI ────────────────────────────────────────
#
# Tentado em 16/10/2026 e RECUSADO pela API do Cloudflare:
#     CPU limits are not supported for the Free plan. [code: 100328]
#
# A conta esta no plano FREE, onde o teto e 10 ms de CPU por requisicao e NAO
# e configuravel. Declarar o bloco nao fica inerte: ele faz TODO deploy falhar,
# inclusive os que nada tem a ver com isso.
#
# E o teto importa, porque e ele que derruba a publicacao:
#     POST ... - Exceeded CPU Limit
#     X [ERROR] Error: Worker exceeded CPU time limit.
# O Cloudflare responde com pagina de erro SEM cabecalho CORS, e o navegador so
# sabe dizer "Failed to fetch" — a tela culpa a rede, e o problema e o teto.
#
# Ha dois caminhos, e os dois estao fora deste arquivo: subir para o Workers
# Paid (ai este bloco passa a valer), ou parar de mandar a base inteira em
# toda gravacao.

# Banco da votação do Planning Poker.
# database_id é preenchido a partir de `wrangler d1 list` (é o UUID do banco).
[[d1_databases]]
binding = "POKER_DB"
database_name = "roadmap_poker"
database_id = "03dd80b0-ea64-4042-bc23-6e7ee438b7cc"

# Repositorio DO DADO. O repo do site e publico (GitHub Pages) e servia
# data/melhorias.json como arquivo estatico: qualquer pessoa com a URL lia a base
# inteira, inclusive por raw.githubusercontent. Apontando para um repo PRIVADO, a
# unica porta passa a ser este Worker (que autentica com GH_TOKEN).
[vars]
DATA_REPO = "RoadMap-dados"

# O repositorio de CODIGO, para o `demanda-procurar` alcancar as issues.
#
# Dono diferente do dos dados, de proposito: `CapFernando/RoadMap-dados` guarda a
# base e `audaxcapitalsa/AXCRED-DJANGO` guarda o sistema. Por isso o caminho aqui
# e completo ("dono/repo") — o `gh()` do worker monta a URL com REPO_OWNER fixo e
# nao serve para este.
#
# Se o token nao alcancar este repositorio, a busca NAO devolve lista vazia: ela
# responde `consultado: false` com o motivo. "Nao achei" e "nao consegui olhar"
# nao podem parecer a mesma coisa para quem decide se cria uma demanda.
CODE_REPO = "audaxcapitalsa/AXCRED-DJANGO"

# Anexos das demandas. Antes viviam como base64 dentro do proprio JSON e
# representavam 1,53 MB de um arquivo de 1,64 MB — 93% do peso da base, baixado
# inteiro em toda leitura. Aqui ficam fora do JSON, que passa a guardar so a
# referencia.
[[r2_buckets]]
binding = "ANEXOS"
bucket_name = "roadmap-anexos"

