<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Fora de buscadores: noindex nao indexa, nofollow nao segue links,
       noarchive impede copia em cache. Isso reduz descoberta, NAO e controle
       de acesso: quem tem a URL continua lendo tudo. -->
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Projetos por Tema — RoadMap</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0E0E0D; --bg2:#161614; --bg3:#1E1E1C; --bg4:#252522;
      --border:#2E2E2B; --border2:#3A3A36;
      --text:#ECEAE2; --text2:#A8A49A; --text3:#6E6A62;
      --blue:#3B8FE8; --amber:#E89C2F; --green:#5EA832;
      --red:#E84444; --purple:#9B6FE8; --teal:#2BBFA0;
      --radius:12px;
    }
    body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; font-size:15px; line-height:1.6; min-height:100vh; }

    /* ── HEADER ── */
    header {
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 32px; border-bottom:1px solid var(--border); background:var(--bg2);
      gap:12px; flex-wrap:wrap; position:sticky; top:0; z-index:10;
    }
    .header-left { display:flex; align-items:center; gap:14px; }
    .header-left h1 { font-size:20px; font-weight:700; }
    .header-right { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:var(--radius); font-size:14px; font-weight:600; font-family:'Inter',sans-serif; cursor:pointer; border:none; transition:opacity .15s; text-decoration:none; }
    .btn-secondary { background:var(--bg3); color:var(--text); border:1px solid var(--border); }
    .btn-secondary:hover { opacity:.8; }
    .btn-primary { background:var(--blue); color:#fff; }
    .btn-primary:hover { opacity:.85; }

    /* ── FILTERS ── */
    .filters {
      display:flex; align-items:flex-end; gap:16px; padding:24px 32px 0;
      flex-wrap:wrap; background:var(--bg);
    }
    .filter-group { display:flex; flex-direction:column; gap:5px; }
    .filter-group label { font-size:12px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:.06em; }
    .filter-group select {
      background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius);
      color:var(--text); padding:10px 14px; font-size:14px; font-weight:500; font-family:inherit; outline:none; min-width:130px;
    }
    .filter-group select:focus { border-color:var(--blue); }

    /* ── MAIN ── */
    main { padding:24px 32px 80px; display:flex; flex-direction:column; gap:24px; }

    /* ── TEMA CARD ── */
    .tema-card {
      background:var(--bg2); border:1px solid var(--border); border-radius:16px; overflow:hidden;
      box-shadow:0 4px 24px #00000033;
    }
    .tema-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:20px 24px; cursor:pointer; user-select:none; transition:background .15s;
      gap:16px; flex-wrap:wrap;
    }
    .tema-header:hover { background:var(--bg3); }
    .tema-header-left { display:flex; align-items:center; gap:14px; }
    .tema-stripe { width:5px; height:52px; border-radius:4px; flex-shrink:0; }
    .tema-name { font-size:20px; font-weight:800; color:var(--text); }
    .tema-sub  { font-size:13px; color:var(--text2); margin-top:2px; }
    .tema-header-right { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .tema-kpi { text-align:center; background:var(--bg4); border-radius:10px; padding:10px 16px; min-width:90px; }
    .tema-kpi-val  { font-size:22px; font-weight:800; }
    .tema-kpi-lbl  { font-size:11px; color:var(--text2); font-weight:500; }
    .tema-toggle   { font-size:18px; color:var(--text3); transition:transform .2s; flex-shrink:0; }
    .tema-toggle.open { transform:rotate(180deg); }

    /* ── BODY ── */
    .tema-body { padding:0 24px 24px; display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    @media(max-width:800px) { .tema-body { grid-template-columns:1fr; } }

    /* ── PANEL ── */
    .panel { background:var(--bg3); border-radius:12px; padding:20px; }
    .panel-title { font-size:13px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.07em; margin-bottom:18px; display:flex; align-items:center; gap:8px; }

    /* ── PROJETO ROW ── */
    .proj-item { border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:10px; background:var(--bg2); transition:border-color .15s; }
    .proj-item:last-child { margin-bottom:0; }
    .proj-item:hover { border-color:var(--border2); }
    .proj-item-header {
      display:flex; align-items:center; gap:12px; padding:12px 16px;
      cursor:pointer; user-select:none;
    }
    .proj-rank { font-size:18px; font-weight:800; color:var(--text3); width:28px; text-align:center; flex-shrink:0; }
    .proj-info { flex:1; min-width:0; }
    .proj-name { font-size:15px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .proj-meta { font-size:12px; color:var(--text2); margin-top:2px; }
    .proj-hours-summary { text-align:right; flex-shrink:0; }
    .proj-hours-main { font-size:18px; font-weight:800; }
    .proj-hours-label { font-size:11px; color:var(--text2); }
    .proj-chevron { font-size:13px; color:var(--text3); flex-shrink:0; transition:transform .2s; }
    .proj-chevron.open { transform:rotate(180deg); }

    .proj-detail {
      display:none; padding:14px 16px 16px; border-top:1px solid var(--border);
      background:var(--bg4);
    }
    .proj-detail.open { display:block; }
    .proj-bars { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
    .proj-bar-row { display:flex; align-items:center; gap:10px; }
    .proj-bar-lbl { font-size:12px; font-weight:600; width:80px; flex-shrink:0; }
    .proj-bar-lbl.plan { color:var(--blue); }
    .proj-bar-lbl.real { color:var(--green); }
    .proj-bar-track { flex:1; background:var(--bg3); border-radius:6px; height:12px; overflow:hidden; }
    .proj-bar-fill { height:12px; border-radius:6px; transition:width .5s; }
    .proj-bar-fill.plan { background:var(--blue); }
    .proj-bar-fill.real { background:var(--green); }
    .proj-bar-val { font-size:13px; font-weight:700; width:50px; text-align:right; flex-shrink:0; }
    .proj-detail-meta { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--text2); }
    .proj-detail-meta span strong { color:var(--text); font-weight:600; }

    /* ── DEVS ── */
    .dev-list { display:flex; flex-direction:column; gap:12px; }
    .dev-row { background:var(--bg2); border-radius:10px; padding:14px 16px; display:flex; align-items:flex-start; gap:14px; }
    .dev-avatar {
      width:44px; height:44px; border-radius:50%; display:flex; align-items:center;
      justify-content:center; font-size:16px; font-weight:800; flex-shrink:0;
    }
    .dev-content { flex:1; min-width:0; }
    .dev-name  { font-size:16px; font-weight:700; color:var(--text); }
    .dev-hours-row { display:flex; gap:16px; margin-top:6px; flex-wrap:wrap; }
    .dev-hours-item { display:flex; flex-direction:column; }
    .dev-hours-val  { font-size:17px; font-weight:800; }
    .dev-hours-lbl  { font-size:11px; color:var(--text2); font-weight:500; margin-top:1px; }
    .dev-bar-row { margin-top:8px; display:flex; align-items:center; gap:8px; }
    .dev-bar-track { flex:1; background:var(--bg4); border-radius:4px; height:6px; overflow:hidden; }
    .dev-bar-fill { height:6px; border-radius:4px; }
    .dev-pct { font-size:12px; color:var(--text3); font-weight:600; flex-shrink:0; }

    /* ── EMPTY ── */
    .empty-msg { text-align:center; color:var(--text3); font-size:16px; padding:60px 20px; }

    /* ── TOAST ── */
    #toast { position:fixed; bottom:24px; right:24px; padding:12px 18px; border-radius:var(--radius); font-size:14px; font-weight:500; opacity:0; pointer-events:none; transition:opacity .3s; z-index:999; }
    #toast.show { opacity:1; }
    #toast.ok  { background:#1a3d1a; color:#7EE0A0; border:1px solid #2d6b2d; }
    #toast.err { background:#3d1a1a; color:#F9A0A0; border:1px solid #6b2d2d; }
  </style>
  <link rel="stylesheet" href="tema.css?v=3e4b5d5d10">
  <script src="tema.js?v=3b74bdc1d4"></script>
</head>
<body>

<header>
  <div class="header-left">
    <h1>📁 Projetos por Tema</h1>
    <span id="lbl-updated" style="font-size:12px;color:var(--text3)">—</span>
  </div>
  <div class="header-right">
    <a href="admin.html" class="btn btn-secondary">← Admin</a>
    <a href="index.html" class="btn btn-secondary" target="_blank">📊 Dashboard</a>
  </div>
</header>

<div class="filters">
  <div class="filter-group">
    <label>Mês</label>
    <select id="f-mes">
      <option value="">Todos</option>
      <option value="1">Janeiro</option><option value="2">Fevereiro</option>
      <option value="3">Março</option><option value="4">Abril</option>
      <option value="5">Maio</option><option value="6">Junho</option>
      <option value="7">Julho</option><option value="8">Agosto</option>
      <option value="9">Setembro</option><option value="10">Outubro</option>
      <option value="11">Novembro</option><option value="12">Dezembro</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Ano</label>
    <select id="f-ano"><option value="">Todos</option></select>
  </div>
  <button class="btn btn-primary" onclick="renderPage()">↺ Atualizar</button>
</div>

<main id="main-content">
  <div class="empty-msg">Carregando dados…</div>
</main>

<div id="toast"></div>

<script>
const REPO    = 'CapFernando/RoadMap';
const FILE    = 'data/melhorias.json';
const API_URL = `https://api.github.com/repos/${REPO}/contents/${FILE}`;
function pEsc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
const PROXY_URL = 'https://roadmap-nova-melhoria.morais-tecnologico.workers.dev';
const RAW_URL = `https://raw.githubusercontent.com/${REPO}/main/${FILE}`;

const COLORS = [
  '#3B8FE8','#5EA832','#E89C2F','#9B6FE8','#2BBFA0',
  '#E84444','#E84494','#4AB0E8','#FFD166','#06D6A0',
  '#FF6B6B','#C9B1FF','#118AB2','#A8E83B','#E8C43B'
];

let state = { temas:[], melhorias:[], feriados:[] };
// Alinhado com as outras telas: com o Worker configurado, NUNCA usa token no
// navegador. Esta era a unica tela que lia GITHUB_TOKEN sem checar o Worker — e
// por isso o token classico do config.js seguia sendo usado a cada abertura local
// (aparecia como "last used" no GitHub, com escopo repo e sem expiracao).
const runtimeToken = PROXY_URL ? '' : (window.GITHUB_TOKEN || localStorage.getItem('rm_token') || '');

function toast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show ' + type;
  clearTimeout(el._t); el._t = setTimeout(() => el.className = '', 3000);
}

function calcHorasPlanejadas(inicio, entrega) {
  if (!inicio || !entrega) return null;
  const ferSet = new Set((state.feriados||[]).map(f=>f.data||f).filter(Boolean));
  let count = 0;
  const d = new Date(inicio+'T00:00:00'), end = new Date(entrega+'T00:00:00');
  if (end < d) return null;
  while (d <= end) {
    const dw = d.getDay();
    if (dw!==0 && dw!==6 && !ferSet.has(d.toISOString().slice(0,10))) count++;
    d.setDate(d.getDate()+1);
  }
  return count * 8;
}

function getHorasEfetivas(m) {
  if (m.horas_realizadas > 0) return m.horas_realizadas;
  return calcHorasPlanejadas(m.inicio, m.entrega) || 0;
}

function splitDevs(s) {
  if (!s) return [];
  return s.split(/[\/,]/).map(d => d.trim()).filter(Boolean);
}

function formatDate(s) {
  if (!s) return '—';
  const [y,m,d] = s.split('-');
  return `${d}/${m}/${y}`;
}

// ── DATA ─────────────────────────────────────────────────────────
// Leitura fresca dos dados.
// raw.githubusercontent.com serve com Cache-Control max-age=300 e IGNORA
// cache-buster na query (X-Cache: HIT mesmo com ?t= aleatorio). Isso fazia o
// painel exibir estado de ate 5 min atras e, pior, a leitura feita ANTES de
// publicar podia nao ver alteracao recente de outra pessoa e apaga-la. O Worker
// le pela API autenticada, que nao passa por esse cache.
//
// A credencial abaixo fica INERTE enquanto o Worker nao exigir: hoje ele
// responde 200 sem nada. Quando a trava de leitura for ativada, ele passa a
// responder 401 e o painel pede a senha — sem precisar de novo deploy do site.
function credenciaisLeitura() {
  const c = {};
  const senha = sessionStorage.getItem('rm_admin_pw') || sessionStorage.getItem('rm_view_pw');
  if (senha) c.senha = senha;
  const chave = new URLSearchParams(location.search).get('k') || sessionStorage.getItem('rm_view_key');
  if (chave) c.chave = chave;
  return c;
}

async function pedirSenhaLeitura() {
  const s = prompt('Esta consulta exige senha de acesso:');
  if (!s) return false;
  sessionStorage.setItem('rm_view_pw', s);
  return true;
}

async function lerDados(permitirCache, jaTentou) {
  try {
    const r = await fetch(PROXY_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ action: 'dados' }, credenciaisLeitura()))
    });
    if (r.ok) return await r.json();
    if (r.status === 401) {
      // Credencial invalida ou ausente: pede uma vez e repete. Nao cai no
      // fallback publico, que deixaria de existir com o repositorio privado.
      sessionStorage.removeItem('rm_view_pw');
      if (!jaTentou && await pedirSenhaLeitura()) return lerDados(permitirCache, true);
      throw new Error('Acesso nao autorizado. Informe a senha correta para consultar.');
    }
  } catch (e) {
    if (e && /nao autorizado/i.test(e.message)) throw e;
  }
  if (!permitirCache) throw new Error('Nao foi possivel ler os dados atualizados. Tente novamente.');
  const r2 = await fetch(RAW_URL + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r2.ok) throw new Error('Falha ao ler dados (HTTP ' + r2.status + ')');
  return r2.json();
}

async function loadData() {
  try {
    // Sem token: lê direto a URL pública (repo público) — evita gastar o limite
    // de 60 req/h da API anônima, que retornaria 403 e cairia no fallback.
    if (!runtimeToken) {
      applyData(await lerDados(true)); return;
    }
    // Com token: media type "raw" — a Contents API padrão devolve content vazio
    // (encoding "none") acima de 1MB, e este JSON já passou disso.
    const res = await fetch(API_URL+'?t='+Date.now(), {
      cache:'no-store',
      headers: { Accept: 'application/vnd.github.raw', Authorization: `token ${runtimeToken}` }
    });
    if (res.ok) {
      applyData(await res.json());
      return;
    }
  } catch(_){}
  try {
    applyData(await lerDados(true));
  } catch(e) { toast('Erro ao carregar dados: '+e.message,'err'); }
}

function applyData(data) {
  state.temas     = data.temas     || [];
  state.melhorias = data.melhorias || [];
  state.feriados  = data.feriados  || [];
  const dt = data.atualizado_em ? new Date(data.atualizado_em).toLocaleString('pt-BR') : '';
  document.getElementById('lbl-updated').textContent = dt ? `Atualizado em ${dt}` : '';
  buildAnoFilter();
  renderPage();
}

function buildAnoFilter() {
  const sel  = document.getElementById('f-ano');
  const anos = new Set();
  state.melhorias.forEach(m => { if (m.inicio) anos.add(m.inicio.slice(0,4)); });
  const curY = new Date().getFullYear().toString();
  anos.add(curY);
  const sorted = [...anos].sort((a,b)=>b-a);
  const cur = sel.value || curY;
  sel.innerHTML = '<option value="">Todos</option>' +
    sorted.map(y=>`<option value="${y}"${y===cur?'selected':''}>${y}</option>`).join('');
  // default mes = current
  const selM = document.getElementById('f-mes');
  if (!selM.value) selM.value = new Date().getMonth()+1;
}

// ── TOGGLE ───────────────────────────────────────────────────────
function toggleTema(id) {
  const body    = document.getElementById('tema-body-'+id);
  const chevron = document.getElementById('tema-chev-'+id);
  const isOpen  = body.style.display !== 'none';
  body.style.display    = isOpen ? 'none' : 'grid';
  chevron.classList.toggle('open', !isOpen);
}

function toggleProj(id) {
  const detail  = document.getElementById('proj-detail-'+id);
  const chevron = document.getElementById('proj-chev-'+id);
  const isOpen  = detail.classList.contains('open');
  detail.classList.toggle('open', !isOpen);
  chevron.classList.toggle('open', !isOpen);
}

// ── RENDER ───────────────────────────────────────────────────────
function renderPage() {
  const mes = parseInt(document.getElementById('f-mes').value) || null;
  const ano = document.getElementById('f-ano').value || null;

  const items = state.melhorias.filter(m => {
    if (m.status_planejamento === 'negada') return false;
    if (!m.inicio) return false;
    const d = new Date(m.inicio+'T00:00:00');
    if (ano && d.getFullYear().toString() !== ano) return false;
    if (mes && d.getMonth()+1 !== mes) return false;
    return true;
  });

  const temas = state.temas.filter(t => items.some(m => m.tema_id === t.id));
  const main  = document.getElementById('main-content');

  if (!temas.length) {
    main.innerHTML = '<div class="empty-msg">Nenhuma demanda encontrada para o período selecionado.</div>';
    return;
  }

  main.innerHTML = temas.map((tema, ti) => {
    const cor        = COLORS[ti % COLORS.length];
    const temaItems  = items.filter(m => m.tema_id === tema.id);
    const concluidos = temaItems.filter(m => m.status_planejamento==='concluido'||m.status==='concluida');
    const totalHPlan = temaItems.reduce((s,m)=>s+(calcHorasPlanejadas(m.inicio,m.entrega)||0),0);
    const totalHReal = temaItems.reduce((s,m)=>s+getHorasEfetivas(m),0);

    // ── TOP 5 projetos ──────────────────────────────────────────
    const top5 = [...temaItems].sort((a,b)=>getHorasEfetivas(b)-getHorasEfetivas(a)).slice(0,5);
    const maxH = top5.length ? getHorasEfetivas(top5[0]) : 1;

    const projHTML = top5.map((m, i) => {
      const hPlan = calcHorasPlanejadas(m.inicio, m.entrega) || 0;
      const hReal = getHorasEfetivas(m);
      const isConcl = m.status_planejamento==='concluido'||m.status==='concluida';
      const maxBar  = Math.max(hPlan, hReal, 1);
      const pctPlan = Math.round(hPlan/maxBar*100);
      const pctReal = Math.round(hReal/maxBar*100);
      const devs    = splitDevs(m.dev).join(', ') || '—';
      const spKey   = m.status_planejamento || 'backlog';
      const statusLabel = {backlog:'Backlog',levantar_req:'Levantar Req.',planejado:'Planejado',em_andamento:'Em Andamento',deploy:'Deploy',concluido:'Concluído',atrasado:'Atrasado'}[spKey]||spKey;
      const pid = `${tema.id}-${m.id}`;

      return `<div class="proj-item">
        <div class="proj-item-header" onclick="toggleProj('${pid}')">
          <span class="proj-rank">${i+1}</span>
          <div class="proj-info">
            <div class="proj-name" title="${pEsc(m.titulo)}">${pEsc(m.titulo)}</div>
            <div class="proj-meta">${pEsc(devs)}</div>
          </div>
          <div class="proj-hours-summary">
            <div class="proj-hours-main" style="color:${cor}">${hReal}h</div>
            <div class="proj-hours-label">${isConcl&&m.horas_realizadas>0?'realizadas':'estimadas'}</div>
          </div>
          <span class="proj-chevron" id="proj-chev-${pid}">▼</span>
        </div>
        <div class="proj-detail" id="proj-detail-${pid}">
          <div class="proj-bars">
            <div class="proj-bar-row">
              <span class="proj-bar-lbl plan">Planejado</span>
              <div class="proj-bar-track"><div class="proj-bar-fill plan" style="width:${pctPlan}%"></div></div>
              <span class="proj-bar-val" style="color:#3B8FE8">${hPlan}h</span>
            </div>
            <div class="proj-bar-row">
              <span class="proj-bar-lbl real">Realizado</span>
              <div class="proj-bar-track"><div class="proj-bar-fill real" style="width:${pctReal}%"></div></div>
              <span class="proj-bar-val" style="color:#5EA832">${hReal}h${!isConcl||m.horas_realizadas===0?'*':''}</span>
            </div>
          </div>
          <div class="proj-detail-meta">
            <span><strong>${formatDate(m.inicio)}</strong> início</span>
            <span><strong>${formatDate(m.entrega)}</strong> entrega</span>
            <span><strong>${statusLabel}</strong></span>
          </div>
        </div>
      </div>`;
    }).join('');

    // ── Devs do tema ─────────────────────────────────────────────
    const devMapPlan = {}, devMapReal = {};
    temaItems.forEach(m => {
      const devs    = splitDevs(m.dev);
      const isConcl = m.status_planejamento==='concluido'||m.status==='concluida';
      const hP = (calcHorasPlanejadas(m.inicio,m.entrega)||0) / (devs.length||1);
      const hR = getHorasEfetivas(m) / (devs.length||1);
      devs.forEach(d => {
        devMapPlan[d] = (devMapPlan[d]||0) + hP;
        if (isConcl) devMapReal[d] = (devMapReal[d]||0) + hR;
      });
    });
    const devArr = Object.entries(devMapPlan).sort((a,b)=>b[1]-a[1]);
    const maxDev = devArr.length ? devArr[0][1] : 1;
    const totalDevPlan = devArr.reduce((s,[,h])=>s+h,0)||1;

    const devsHTML = devArr.slice(0,8).map(([dev, hPlan], i) => {
      const hReal    = Math.round(devMapReal[dev]||0);
      const hPlanRnd = Math.round(hPlan);
      const pct      = Math.round(hPlan/totalDevPlan*100);
      const barPct   = Math.round(hPlan/maxDev*100);
      const initials = dev.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
      const bg       = COLORS[i%COLORS.length]+'22';
      const fg       = COLORS[i%COLORS.length];
      return `<div class="dev-row">
        <div class="dev-avatar" style="background:${bg};color:${fg}">${initials}</div>
        <div class="dev-content">
          <div class="dev-name">${pEsc(dev)}</div>
          <div class="dev-hours-row">
            <div class="dev-hours-item">
              <span class="dev-hours-val" style="color:#3B8FE8">${hPlanRnd}h</span>
              <span class="dev-hours-lbl">Planejadas</span>
            </div>
            ${hReal>0?`<div class="dev-hours-item">
              <span class="dev-hours-val" style="color:#5EA832">${hReal}h</span>
              <span class="dev-hours-lbl">Realizadas</span>
            </div>`:''}
          </div>
          <div class="dev-bar-row">
            <div class="dev-bar-track">
              <div class="dev-bar-fill" style="width:${barPct}%;background:${fg}"></div>
            </div>
            <span class="dev-pct">${pct}%</span>
          </div>
        </div>
      </div>`;
    }).join('');

    return `<div class="tema-card">
      <div class="tema-header" onclick="toggleTema('${tema.id}')">
        <div class="tema-header-left">
          <div class="tema-stripe" style="background:${cor}"></div>
          <div>
            <div class="tema-name">${pEsc(tema.nome)}</div>
            <div class="tema-sub">${temaItems.length} demandas · ${concluidos.length} concluídas</div>
          </div>
        </div>
        <div class="tema-header-right">
          <div class="tema-kpi">
            <div class="tema-kpi-val" style="color:var(--blue)">${totalHPlan}h</div>
            <div class="tema-kpi-lbl">Planejadas</div>
          </div>
          <div class="tema-kpi">
            <div class="tema-kpi-val" style="color:var(--green)">${totalHReal}h</div>
            <div class="tema-kpi-lbl">Realizadas/Est.</div>
          </div>
          <span class="tema-toggle open" id="tema-chev-${tema.id}">▲</span>
        </div>
      </div>
      <div class="tema-body" id="tema-body-${tema.id}" style="display:grid">
        <div class="panel">
          <div class="panel-title">🏆 Top 5 — horas de desenvolvimento</div>
          ${top5.length ? projHTML : '<p style="color:var(--text3);font-size:14px">Sem demandas no período</p>'}
        </div>
        <div class="panel">
          <div class="panel-title">👥 Principais atuantes</div>
          ${devArr.length ? `<div class="dev-list">${devsHTML}</div>` : '<p style="color:var(--text3);font-size:14px">Sem dados</p>'}
        </div>
      </div>
    </div>`;
  }).join('');
}

loadData();
</script>
</body>
</html>
