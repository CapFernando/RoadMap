<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoadMap de Melhorias — Audax Capital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0E0E0D;
      --bg2:      #161614;
      --bg3:      #1E1E1C;
      --bg4:      #252522;
      --border:   #2E2E2B;
      --border2:  #3A3A36;
      --text:     #ECEAE2;
      --text2:    #A8A49A;
      --text3:    #6E6A62;

      --blue:     #3B8FE8;
      --blue-bg:  #0C3260;
      --blue-tx:  #9BC8F8;

      --amber:    #E89C2F;
      --amber-bg: #5C3608;
      --amber-tx: #F9C97A;

      --green:    #5EA832;
      --green-bg: #1E4208;
      --green-tx: #B2E07A;

      --purple:   #9B6FE8;
      --purple-bg:#341A6E;
      --purple-tx:#C9AEFF;

      --teal:     #2BBFA0;
      --teal-bg:  #063D30;
      --teal-tx:  #7EECD8;

      --red:      #E84444;
      --red-bg:   #5C0A0A;
      --red-tx:   #F9A0A0;

      --radius:   10px;
      --radius-sm:6px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-left h1 { font-size: 20px; font-weight: 600; color: var(--text); }
    .header-left p  { font-size: 14px; color: var(--text2); margin-top: 2px; }
    .header-right   { font-size: 13px; color: var(--text3); }

    /* MAIN */
    main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

    /* SUMMARY CARDS */
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 32px; }
    .sum-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .sum-card:hover { border-color: var(--text3); }
    .sum-card.active { border-color: var(--text); background: #1E1E1C; }
    .sum-card.active .n { color: #fff; }
    .sum-card .n   { font-size: 30px; font-weight: 700; color: var(--text); line-height: 1; }
    .sum-card .lbl { font-size: 13px; color: var(--text2); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* CHARTS */
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px; }
    @media (max-width: 600px) { .charts { grid-template-columns: 1fr; } }
    .chart-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .chart-card h3 { font-size: 14px; font-weight: 500; color: var(--text2); margin-bottom: 12px; }
    .chart-inner   { height: 180px; position: relative; }
    .chart-legend  { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .leg { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); }
    .leg-sq { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

    /* FILTER BAR */
    .filter-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
      padding: 14px 18px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filter-row + .filter-row { border-top: 1px solid var(--border); padding-top: 10px; }
    .filter-bar span { font-size: 13px; color: var(--text3); margin-right: 4px; white-space: nowrap; }
    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text2);
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover { border-color: var(--border2); color: var(--text); }
    .filter-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .filter-select {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text2);
      cursor: pointer;
      outline: none;
    }
    .filter-select:focus { border-color: var(--blue); }
    .filter-select option { background: var(--bg3); }

    /* TEMAS */
    .section-title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 16px; }

    .tema-block { margin-bottom: 14px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

    .tema-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--bg2);
      cursor: pointer;
      user-select: none;
      gap: 12px;
    }
    .tema-header:hover { background: var(--bg3); }
    .tema-header-left { display: flex; align-items: center; gap: 12px; }
    .tema-nome { font-size: 16px; font-weight: 600; color: var(--text); }
    .tema-count { font-size: 13px; color: var(--text3); }
    .tema-arrow {
      color: var(--text3);
      font-size: 18px;
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }
    .tema-arrow.open { transform: rotate(180deg); }

    .tema-body { display: none; padding: 4px 0 8px; }
    .tema-body.open { display: block; }

    /* MELHORIAS */
    .melhoria {
      margin: 6px 14px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }

    .melhoria-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    .melhoria-titulo { font-size: 16px; font-weight: 600; color: var(--text); flex: 1; }
    .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .badge-recebida  { background: var(--blue-bg);   color: var(--blue-tx);   }
    .badge-refinamento{ background: var(--purple-bg); color: var(--purple-tx); }
    .badge-regra     { background: var(--teal-bg);   color: var(--teal-tx);   }
    .badge-estimada  { background: var(--amber-bg);  color: var(--amber-tx);  }
    .badge-iniciada  { background: var(--green-bg);  color: var(--green-tx);  }
    .badge-negada    { background: var(--red-bg);    color: var(--red-tx);    }
    .badge-levantar_req { background: #2A1A4E22;     color: #C9AEFF;          }
    .badge-planejado    { background: #0C326022;     color: #9BC8F8;          }
    .badge-concluida    { background: #1E420822;     color: #B2E07A;          }

    .melhoria-desc {
      font-size: 15px;
      color: var(--text2);
      line-height: 1.65;
      margin-bottom: 10px;
    }

    .melhoria-negada-motivo {
      background: var(--red-bg);
      border-left: 3px solid var(--red);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--red-tx);
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .melhoria-negada-motivo strong { display: block; font-size: 12px; margin-bottom: 2px; opacity: 0.7; }

    .melhoria-meta { display: flex; flex-wrap: wrap; gap: 10px; }
    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      color: var(--text2);
      background: var(--bg4);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px 10px;
    }
    .meta-item svg { width: 14px; height: 14px; opacity: 0.7; flex-shrink: 0; }

    /* EMPTY */
    .empty {
      text-align: center;
      padding: 60px 24px;
      color: var(--text3);
      font-size: 15px;
    }

    /* LOADING */
    .loading { text-align: center; padding: 80px; color: var(--text3); font-size: 15px; }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 13px;
      color: var(--text3);
      border-top: 1px solid var(--border);
      margin-top: 32px;
    }

    @media (max-width: 600px) {
      header { padding: 16px 18px; }
      main   { padding: 20px 14px; }
      .melhoria { margin: 6px 8px; padding: 14px; }
      .melhoria-titulo { font-size: 15px; }
      .melhoria-desc   { font-size: 14px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>🗺️ RoadMap de Melhorias</h1>
    <p>Audax Capital · Produto &amp; Tecnologia</p>
  </div>
  <div class="header-right" style="display:flex;align-items:center;gap:16px;">
    <span id="ultima-atualizacao" style="font-size:13px;color:var(--text3)">—</span>
    <button id="btn-refresh" onclick="forceRefresh()" style="font-size:13px;color:var(--text3);background:none;border:1px solid var(--border);border-radius:var(--radius);padding:5px 12px;cursor:pointer;transition:color 0.15s,border-color 0.15s;" title="Forçar atualização dos dados" onmouseover="this.style.color='var(--text)';this.style.borderColor='var(--border2)'" onmouseout="this.style.color='var(--text3)';this.style.borderColor='var(--border)'">↻ Atualizar</button>
    <button onclick="openExportModal()" style="font-size:13px;color:var(--text3);background:none;border:1px solid var(--border);border-radius:var(--radius);padding:5px 12px;cursor:pointer;transition:color 0.15s,border-color 0.15s;" title="Exportar relatório" onmouseover="this.style.color='var(--text)';this.style.borderColor='var(--border2)'" onmouseout="this.style.color='var(--text3)';this.style.borderColor='var(--border)'">⬇ Exportar</button>
    <a href="admin.html" style="font-size:13px;color:var(--text3);text-decoration:none;padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius);transition:color 0.15s,border-color 0.15s;" onmouseover="this.style.color='var(--text)';this.style.borderColor='var(--border2)'" onmouseout="this.style.color='var(--text3)';this.style.borderColor='var(--border)'">⚙ Admin</a>
  </div>
</header>

<main>
  <div id="app">
    <div class="loading">Carregando melhorias…</div>
  </div>
</main>

<footer>Painel interno · Audax Capital · Produto &amp; Tecnologia</footer>

<script>
const GITHUB_USER = 'CapFernando';
const GITHUB_REPO = 'RoadMap';
const DATA_PATH   = 'data/melhorias.json';
// Raw URL: sem rate limit — usado para polling em background (aceita delay de CDN)
const RAW_URL     = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${DATA_PATH}`;
// API URL: dados sempre frescos — usado apenas em refresh forçado (botão / visibilitychange)
const API_URL     = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${DATA_PATH}`;

const STATUS_META = {
  recebida:    { label: 'Backlog',             cls: 'badge-recebida',    cor: '#3B8FE8' },
  refinamento: { label: 'Em Refinamento',      cls: 'badge-refinamento', cor: '#9B6FE8' },
  regra:       { label: 'Validar Regra',       cls: 'badge-regra',       cor: '#2BBFA0' },
  estimada:    { label: 'Estimada',            cls: 'badge-estimada',    cor: '#E89C2F' },
  iniciada:    { label: 'Em Andamento',        cls: 'badge-iniciada',    cor: '#5EA832' },
  concluida:   { label: 'Concluída',           cls: 'badge-concluida',   cor: '#5EA832' },
  negada:      { label: 'Negada',              cls: 'badge-negada',      cor: '#E84444' },
  // status_planejamento (Gantt)
  levantar_req:{ label: 'Levantar Requisitos', cls: 'badge-levantar_req',cor: '#9B6FE8' },
  planejado:   { label: 'Planejado',           cls: 'badge-planejado',   cor: '#3B8FE8' },
  em_andamento:{ label: 'Em Andamento',        cls: 'badge-iniciada',    cor: '#5EA832' },
  concluido:   { label: 'Concluído',           cls: 'badge-concluida',   cor: '#2BBFA0' },
  atrasado:    { label: 'Atrasado',            cls: 'badge-negada',      cor: '#E84444' },
};

const TEMA_CORES = ['#3B8FE8','#9B6FE8','#2BBFA0','#E89C2F','#5EA832','#E84444','#E86A3B','#3BE8C4'];

function svgIcon(name) {
  const icons = {
    calendar: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
    clock:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
    user:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
    info:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
    chevron:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>`,
  };
  return icons[name] || '';
}

function badgeHTML(status, sp) {
  // status_planejamento tem prioridade quando indica que já saiu do backlog
  const key = (sp && sp !== 'backlog') ? sp : (status || 'recebida');
  const meta = STATUS_META[key] || STATUS_META.recebida;
  return `<span class="badge ${meta.cls}">${meta.label}</span>`;
}

function metaHTML(m) {
  const items = [];
  if (m.dev)     items.push(`${svgIcon('user')} ${m.dev}`);
  if (m.inicio)  items.push(`${svgIcon('calendar')} Início: ${formatDate(m.inicio)}`);
  if (m.entrega) items.push(`${svgIcon('calendar')} Entrega: ${formatDate(m.entrega)}`);
  if (m.estimativa) items.push(`${svgIcon('clock')} Estimativa: ${m.estimativa}`);
  if (!items.length) return '';
  return `<div class="melhoria-meta">${items.map(i => `<span class="meta-item">${i}</span>`).join('')}</div>`;
}

function formatDate(s) {
  if (!s) return '';
  const [y, mo, d] = s.split('-');
  return `${d}/${mo}/${y}`;
}

function motivoHTML(m) {
  if (m.status !== 'negada' || !m.motivo_negacao) return '';
  return `<div class="melhoria-negada-motivo"><strong>Motivo da negativa</strong>${m.motivo_negacao}</div>`;
}

function renderMelhoria(m) {
  return `
    <div class="melhoria">
      <div class="melhoria-top">
        <div class="melhoria-titulo">${m.titulo}</div>
        ${badgeHTML(m.status, m.status_planejamento)}
      </div>
      ${m.descricao ? `<div class="melhoria-desc">${m.descricao}</div>` : ''}
      ${motivoHTML(m)}
      ${metaHTML(m)}
    </div>`;
}

function renderTema(tema, melhorias, idx) {
  const id = `tema-${tema.id}`;
  const cor = TEMA_CORES[idx % TEMA_CORES.length];
  const items = melhorias.filter(m => m.tema_id === tema.id);
  const count = items.length;
  if (count === 0) return ''; // oculta tema sem itens (especialmente sob filtro)
  return `
    <div class="tema-block">
      <div class="tema-header" onclick="toggleTema('${id}')" aria-expanded="false" aria-controls="${id}-body">
        <div class="tema-header-left">
          <span style="width:12px;height:12px;border-radius:50%;background:${cor};flex-shrink:0;display:inline-block;"></span>
          <span class="tema-nome">${tema.nome}</span>
          <span class="tema-count">${count} ${count === 1 ? 'melhoria' : 'melhorias'}</span>
        </div>
        <span class="tema-arrow" id="${id}-arrow">${svgIcon('chevron')}</span>
      </div>
      <div class="tema-body" id="${id}-body">
        ${[...items].sort((a,b) => (a.inicio||'9999').localeCompare(b.inicio||'9999')).map(renderMelhoria).join('')}
      </div>
    </div>`;
}

function toggleTema(id) {
  const body   = document.getElementById(`${id}-body`);
  const arrow  = document.getElementById(`${id}-arrow`);
  const header = arrow.closest('[aria-expanded]');
  const open   = body.classList.toggle('open');
  arrow.classList.toggle('open');
  if (header) header.setAttribute('aria-expanded', open);
}

function buildCharts(temas, melhorias) {
  // por tema
  const temaLabels = temas.map(t => t.nome);
  const temaData   = temas.map(t => melhorias.filter(m => m.tema_id === t.id).length);
  const temaCores  = temas.map((_, i) => TEMA_CORES[i % TEMA_CORES.length]);

  // por status
  const stLabels = Object.values(STATUS_META).map(s => s.label);
  const stKeys   = Object.keys(STATUS_META);
  const stData   = stKeys.map(k => melhorias.filter(m => getStatusKey(m) === k).length);
  const stCores  = stKeys.map(k => STATUS_META[k].cor);

  const cfg = (labels, data, cores) => ({
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: cores, borderWidth: 2, borderColor: '#0E0E0D', hoverOffset: 6 }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '60%',
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1E1E1C', titleColor: '#ECEAE2', bodyColor: '#A8A49A',
          borderColor: '#2E2E2B', borderWidth: 1,
          callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed}` }
        }
      }
    }
  });

  new Chart(document.getElementById('chart-temas'), cfg(temaLabels, temaData, temaCores));
  new Chart(document.getElementById('chart-status'), cfg(stLabels, stData, stCores));

  // legendas
  const legTema = document.getElementById('leg-temas');
  temas.forEach((t, i) => {
    const n = temaData[i];
    legTema.innerHTML += `<span class="leg"><span class="leg-sq" style="background:${temaCores[i]}"></span>${t.nome} <strong style="color:var(--text);margin-left:2px;">${n}</strong></span>`;
  });

  const legStatus = document.getElementById('leg-status');
  stKeys.forEach((k, i) => {
    if (!stData[i]) return;
    legStatus.innerHTML += `<span class="leg"><span class="leg-sq" style="background:${stCores[i]}"></span>${stLabels[i]} <strong style="color:var(--text);margin-left:2px;">${stData[i]}</strong></span>`;
  });
}

const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

let _temas = [], _melhorias = [], _devs = [];
let _ano = null, _mes = null, _dev = null, _statusFilter = null, _temaFilter = null;

// Deriva o status unificado de um item (alinhado com Admin e Gantt)
function getStatusKey(m) {
  const sp = m.status_planejamento;
  if (sp && sp !== 'backlog') return sp;
  const legacy = { recebida:'backlog', refinamento:'planejado', regra:'planejado',
                   estimada:'planejado', iniciada:'em_andamento', concluida:'concluido',
                   concluido:'concluido', negada:'negada' };
  return legacy[m.status] || sp || 'backlog';
}

const STATUS_CARDS = [
  { key:'total',        label:'Total',              cor:'var(--blue)' },
  { key:'backlog',      label:'Backlog',             cor:'var(--blue)' },
  { key:'levantar_req', label:'Levantar Requisitos', cor:'#9B6FE8' },
  { key:'planejado',    label:'Planejado',           cor:'var(--blue)' },
  { key:'em_andamento', label:'Em Andamento',        cor:'var(--green)' },
  { key:'concluido',    label:'Concluído',           cor:'#2BBFA0' },
  { key:'atrasado',     label:'Atrasado',            cor:'var(--red)' },
  { key:'negada',       label:'Negada',              cor:'var(--red)' },
];

function splitDevs(devStr) {
  if (!devStr) return [];
  return devStr.split(/[\/,]/).map(s => s.trim()).filter(Boolean);
}

function filtradas() {
  return _melhorias.filter(m => {
    if (_ano !== null || _mes !== null) {
      // usa data de início planejada; sem ela usa criado_em (backlog sem data)
      const ref = m.inicio ? new Date(m.inicio + 'T00:00:00') : new Date(m.criado_em);
      if (_ano !== null && ref.getFullYear() !== _ano) return false;
      if (_mes !== null && ref.getMonth() !== _mes) return false;
    }
    if (_dev && !splitDevs(m.dev).includes(_dev)) return false;
    if (_temaFilter && m.tema_id !== _temaFilter) return false;
    if (_statusFilter) return getStatusKey(m) === _statusFilter;
    if (['concluido','negada'].includes(getStatusKey(m))) return false;
    return true;
  });
}

function renderConteudo() {
  const mel = filtradas();

  // conta por status unificado (usa mel sem filtro de status para mostrar totais reais)
  const melSemStatus = _melhorias.filter(m => {
    if (_ano !== null || _mes !== null) {
      const ref = m.inicio ? new Date(m.inicio + 'T00:00:00') : new Date(m.criado_em);
      if (_ano !== null && ref.getFullYear() !== _ano) return false;
      if (_mes !== null && ref.getMonth() !== _mes) return false;
    }
    if (_dev && !splitDevs(m.dev).includes(_dev)) return false;
    if (_temaFilter && m.tema_id !== _temaFilter) return false;
    return true;
  });
  const counts = { total: melSemStatus.length };
  STATUS_CARDS.forEach(c => { if (c.key !== 'total') counts[c.key] = melSemStatus.filter(m => getStatusKey(m) === c.key).length; });

  // monta cards: Total sempre aparece; os outros só se count > 0
  const cardsHTML = STATUS_CARDS
    .filter(c => c.key === 'total' || counts[c.key] > 0)
    .map(c => {
      const isActive = c.key === 'total' ? !_statusFilter : _statusFilter === c.key;
      return `<div class="sum-card ${isActive ? 'active' : ''}" onclick="setFiltroStatus('${c.key}')">
        <div class="n">${counts[c.key]}</div>
        <div class="lbl"><span class="dot" style="background:${c.cor}"></span>${c.label}</div>
      </div>`;
    }).join('');

  const label = (_ano !== null && _mes !== null) ? `${MESES[_mes]} de ${_ano}`
              : (_ano !== null)                  ? `Ano ${_ano}`
              : (_mes !== null)                  ? `${MESES[_mes]} — todos os anos`
              :                                   'Todos os lançamentos';

  document.getElementById('conteudo').innerHTML = `
    <div class="summary">${cardsHTML}</div>

    <div class="charts">
      <div class="chart-card">
        <h3>Por tema</h3>
        <div class="chart-inner"><canvas id="chart-temas"></canvas></div>
        <div class="chart-legend" id="leg-temas"></div>
      </div>
      <div class="chart-card">
        <h3>Por status</h3>
        <div class="chart-inner"><canvas id="chart-status"></canvas></div>
        <div class="chart-legend" id="leg-status"></div>
      </div>
    </div>

    <div class="chart-card" style="margin-bottom:32px;" id="chart-devs-card">
      <h3 onclick="toggleDevChart()" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;">
        Por desenvolvedor
        <span id="dev-chart-arrow" style="font-size:12px;color:var(--text3);transition:transform .2s;">▼</span>
      </h3>
      <div id="chart-devs-inner" style="display:none;position:relative;margin-top:12px;"><canvas id="chart-devs"></canvas></div>
      <div class="chart-legend" id="leg-devs" style="display:none;margin-top:14px;"></div>
    </div>

    <div class="section-title">Melhorias por tema · <span style="font-weight:400;color:var(--text3);font-size:14px">${label}</span></div>
    ${_temas.length === 0
      ? `<div class="empty">Nenhum tema cadastrado ainda.</div>`
      : _temas.map((t, i) => renderTema(t, mel, i)).join('')}
  `;

  if (_temas.length > 0) {
    try { buildCharts(_temas, mel); } catch (_) {}
  }
  try { buildDevChart(_temas, mel); } catch (_) {}
}

function buildFilterBar() {
  const anos = [...new Set(_melhorias.map(m => new Date(m.criado_em).getFullYear()))].sort((a,b) => b - a);
  const devs = _devs.length ? _devs : [...new Set(_melhorias.flatMap(m => splitDevs(m.dev)))].sort();

  const anoOpts = anos.map(a => `<option value="${a}" ${_ano===a?'selected':''}>${a}</option>`).join('');
  const mesOpts = MESES.map((m,i) => `<option value="${i}" ${_mes===i?'selected':''}>${m}</option>`).join('');
  const devChips = devs.map(d =>
    `<button class="filter-btn ${_dev===d?'active':''}" onclick="setFiltroDev('${d.replace(/'/g,"\\'")}')">${d}</button>`
  ).join('');

  const temaChips = _temas.map((t, i) => {
    const cor = TEMA_CORES[i % TEMA_CORES.length];
    const ativo = _temaFilter === t.id;
    return `<button class="filter-btn ${ativo?'active':''}" onclick="setFiltroTema('${t.id}')" style="${ativo?`background:${cor}20;border-color:${cor};color:${cor};`:''}">${t.nome}</button>`;
  }).join('');

  document.getElementById('filter-bar').innerHTML = `
    <div class="filter-row">
      <span>Período:</span>
      <button class="filter-btn ${_ano===null && _mes===null ? 'active' : ''}" onclick="setFiltro(null,null)">Tudo</button>
      <select class="filter-select" onchange="setFiltroAno(this.value)" ${anos.length===0?'disabled':''}>
        <option value="">— Ano —</option>
        ${anoOpts}
      </select>
      <select class="filter-select" onchange="setFiltroMes(this.value)">
        <option value="">— Mês —</option>
        ${mesOpts}
      </select>
    </div>
    ${devs.length > 0 ? `
    <div class="filter-row">
      <span>Dev:</span>
      <button class="filter-btn ${!_dev ? 'active' : ''}" onclick="setFiltroDev(null)">Todos</button>
      ${devChips}
    </div>` : ''}
    ${_temas.length > 0 ? `
    <div class="filter-row">
      <span>Tema:</span>
      <button class="filter-btn ${!_temaFilter ? 'active' : ''}" onclick="setFiltroTema(null)">Todos</button>
      ${temaChips}
    </div>` : ''}
  `;
}

function toggleDevChart() {
  const inner  = document.getElementById('chart-devs-inner');
  const legend = document.getElementById('leg-devs');
  const arrow  = document.getElementById('dev-chart-arrow');
  if (!inner) return;
  const open = inner.style.display === 'none';
  inner.style.display  = open ? '' : 'none';
  legend.style.display = open ? '' : 'none';
  if (arrow) arrow.style.transform = open ? 'rotate(180deg)' : '';
}

function setFiltroTema(id) {
  _temaFilter = (id === _temaFilter) ? null : id;
  buildFilterBar();
  renderConteudo();
}

function setFiltro(ano, mes) {
  _ano = ano; _mes = mes;
  buildFilterBar();
  renderConteudo();
}
function setFiltroAno(val) {
  _ano = val ? parseInt(val) : null;
  buildFilterBar();
  renderConteudo();
}
function setFiltroMes(val) {
  _mes = val !== '' ? parseInt(val) : null;
  buildFilterBar();
  renderConteudo();
}
function setFiltroDev(dev) {
  _dev = dev;
  buildFilterBar();
  renderConteudo();
}
function setFiltroStatus(key) {
  _statusFilter = (key === 'total' || key === _statusFilter) ? null : key;
  renderConteudo();
}

function buildDevChart(temas, melhorias) {
  const card = document.getElementById('chart-devs-card');
  const devs = [...new Set(melhorias.flatMap(m => splitDevs(m.dev)))].sort();
  if (!devs.length) { if (card) card.style.display = 'none'; return; }
  if (card) card.style.display = '';

  const temaCores = temas.map((_, i) => TEMA_CORES[i % TEMA_CORES.length]);

  const datasets = temas.map((t, i) => ({
    label: t.nome,
    data: devs.map(dev => melhorias.filter(m => splitDevs(m.dev).includes(dev) && m.tema_id === t.id).length),
    backgroundColor: temaCores[i],
    borderWidth: 0,
    borderRadius: 3,
  }));

  const semTema = devs.map(dev =>
    melhorias.filter(m => splitDevs(m.dev).includes(dev) && !temas.find(t => t.id === m.tema_id)).length
  );
  if (semTema.some(v => v > 0)) {
    datasets.push({ label: 'Sem tema', data: semTema, backgroundColor: '#4A4A46', borderWidth: 0, borderRadius: 3 });
  }

  const inner = document.getElementById('chart-devs-inner');
  inner.style.height = Math.max(160, devs.length * 44) + 'px';

  new Chart(document.getElementById('chart-devs'), {
    type: 'bar',
    data: { labels: devs, datasets },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          stacked: true,
          ticks: { color: '#6E6A62', stepSize: 1, precision: 0 },
          grid: { color: '#2E2E2B' },
          border: { color: '#2E2E2B' },
        },
        y: {
          stacked: true,
          ticks: { color: '#A8A49A', font: { size: 13 } },
          grid: { display: false },
          border: { display: false },
        },
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1E1E1C', titleColor: '#ECEAE2', bodyColor: '#A8A49A',
          borderColor: '#2E2E2B', borderWidth: 1,
          callbacks: {
            title: ctx => ctx[0].label,
            label: ctx => ctx.parsed.x > 0 ? ` ${ctx.dataset.label}: ${ctx.parsed.x}` : null,
          },
        },
      },
    },
  });

  const leg = document.getElementById('leg-devs');
  temas.forEach((t, i) => {
    const total = devs.reduce((s, dev) => s + melhorias.filter(m => splitDevs(m.dev).includes(dev) && m.tema_id === t.id).length, 0);
    if (!total) return;
    leg.innerHTML += `<span class="leg"><span class="leg-sq" style="background:${temaCores[i]}"></span>${t.nome} <strong style="color:var(--text);margin-left:2px;">${total}</strong></span>`;
  });
}

let _pollTs = null;

async function loadData() {
  const app = document.getElementById('app');
  try {
    const res = await fetch(RAW_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('Não foi possível carregar os dados.');
    const data = await res.json();
    _pollTs = data.atualizado_em || null;

    _temas     = data.temas     || [];
    _melhorias = data.melhorias || [];
    // une devs do array raiz + devs extraídos das melhorias (garante que devs sem tarefa apareçam)
    _devs = [...new Set([
      ...(data.desenvolvedores || []).flatMap(d => splitDevs(d)),
      ..._melhorias.flatMap(m => splitDevs(m.dev))
    ])].sort();

    const dt = data.atualizado_em
      ? new Date(data.atualizado_em).toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' })
      : '—';
    document.getElementById('ultima-atualizacao').textContent = `Atualizado em ${dt}`;

    app.innerHTML = `
      <div class="filter-bar" id="filter-bar"></div>
      <div id="conteudo"></div>
    `;

    buildFilterBar();
    renderConteudo();

  } catch (e) {
    app.innerHTML = `<div class="empty">${e.message}</div>`;
  }
}

// Aplica dados novos na UI
function applyData(data) {
  _pollTs    = data.atualizado_em || null;
  _temas     = data.temas     || [];
  _melhorias = data.melhorias || [];
  _devs = [...new Set([
    ...(data.desenvolvedores || []).flatMap(d => splitDevs(d)),
    ..._melhorias.flatMap(m => splitDevs(m.dev))
  ])].sort();
  const dt = data.atualizado_em
    ? new Date(data.atualizado_em).toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' })
    : '—';
  const el = document.getElementById('ultima-atualizacao');
  if (el) el.textContent = `Atualizado em ${dt}`;
  buildFilterBar();
  renderConteudo();
}

// Toast simples para o dashboard
let _dashToastTimer;
function dashToast(msg, type = 'ok') {
  let el = document.getElementById('dash-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'dash-toast';
    el.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:9000;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;max-width:360px;line-height:1.4;transition:opacity .3s;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.background = type === 'err' ? '#5C0A0A' : '#1E4208';
  el.style.color       = type === 'err' ? '#F9A0A0' : '#B2E07A';
  el.style.border      = `1px solid ${type === 'err' ? '#7A1A1A' : '#2E5A10'}`;
  el.style.opacity = '1';
  clearTimeout(_dashToastTimer);
  _dashToastTimer = setTimeout(() => { el.style.opacity = '0'; }, 5000);
}

// Refresh forçado via GitHub API; fallback para raw URL se rate-limitado
async function forceRefresh() {
  const btn = document.getElementById('btn-refresh');
  if (btn) { btn.textContent = '↻ Atualizando…'; btn.disabled = true; }
  try {
    const res = await fetch(API_URL + '?t=' + Date.now(), {
      cache: 'no-store',
      headers: { Accept: 'application/vnd.github.v3+json' }
    });
    if (res.ok) {
      const json = await res.json();
      const data = JSON.parse(decodeURIComponent(escape(atob(json.content.replace(/\n/g, '')))));
      applyData(data);
    } else if (res.status === 403 || res.status === 429) {
      // Rate limit atingido — tenta raw URL como fallback
      const rawRes = await fetch(RAW_URL + '?nocache=' + Date.now(), { cache: 'no-store' });
      if (rawRes.ok) {
        const data = await rawRes.json();
        applyData(data);
        dashToast('⚠️ Limite de API atingido. Exibindo cache — alterações recentes podem levar até 5 min para aparecer.', 'err');
      } else {
        dashToast('⚠️ Limite de requisições atingido. Aguarde alguns minutos e tente novamente.', 'err');
      }
    } else {
      dashToast('⚠️ Erro ao atualizar (HTTP ' + res.status + '). Tente novamente.', 'err');
    }
  } catch(_) {
    // Fallback silencioso em visibilitychange; notifica só quando o usuário clicou
    if (btn && btn.disabled) dashToast('⚠️ Falha de conexão ao atualizar.', 'err');
  }
  if (btn) { btn.textContent = '↻ Atualizar'; btn.disabled = false; }
}

loadData();

// ── SYNC ──────────────────────────────────────────────────────────────
// Polling em background usa raw URL (sem rate limit) — aceita até ~5min de delay de CDN
let _polling = false;
async function checkForUpdates() {
  if (_polling) return;
  _polling = true;
  try {
    const res = await fetch(RAW_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) { _polling = false; return; }
    const data = await res.json();
    if (_pollTs !== undefined && data.atualizado_em !== _pollTs) applyData(data);
  } catch(_) {}
  _polling = false;
}

// Polling de fundo a cada 60s (raw URL — sem rate limit)
setInterval(checkForUpdates, 60000);

// Ao voltar para a aba: usa API para dados imediatamente frescos
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') forceRefresh();
});

const STATUS_BADGE_PRINT = {
  backlog:      { label: 'Backlog',       bg: '#0C3260', color: '#9BC8F8' },
  levantar_req: { label: 'Levantar req.', bg: '#341A6E', color: '#C9AEFF' },
  planejado:    { label: 'Planejado',     bg: '#5C3608', color: '#F9C97A' },
  em_andamento: { label: 'Em Andamento',  bg: '#063D30', color: '#7EECD8' },
  concluido:    { label: 'Concluído',     bg: '#1E4208', color: '#B2E07A' },
  atrasado:     { label: 'Atrasado',      bg: '#5C0A0A', color: '#F9A0A0' },
  negada:       { label: 'Negada',        bg: '#5C0A0A', color: '#F9A0A0' },
};

function buildReportHTML() {
  const mel = filtradas();
  const now = new Date();
  const dateStr = now.toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' });

  // Descrição do filtro ativo
  const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  let filtroDesc = 'Todos os períodos';
  if (_mes !== null && _ano !== null) filtroDesc = `${MESES_PT[_mes - 1]} de ${_ano}`;
  else if (_mes !== null) filtroDesc = MESES_PT[_mes - 1] + ' — todos os anos';
  else if (_ano !== null) filtroDesc = `Ano ${_ano}`;
  if (_dev) filtroDesc += ` · ${_dev}`;
  if (_statusFilter) filtroDesc += ` · ${STATUS_BADGE_PRINT[_statusFilter]?.label || _statusFilter}`;

  // Agrupar por tema
  const temaOrder = _temas.map(t => t.id);
  const groups = {};
  mel.forEach(m => {
    const k = m.tema_id || '__';
    if (!groups[k]) groups[k] = [];
    groups[k].push(m);
  });
  const groupKeys = Object.keys(groups).sort((a,b) => {
    const ia = temaOrder.indexOf(a), ib = temaOrder.indexOf(b);
    if (ia === -1 && ib === -1) return 0;
    if (ia === -1) return 1; if (ib === -1) return -1;
    return ia - ib;
  });

  const temasHTML = groupKeys.map((tKey, gi) => {
    const temaNome = tKey === '__' ? 'Sem tema' : (_temas.find(t => t.id === tKey)?.nome || '—');
    const cor = TEMA_CORES[gi % TEMA_CORES.length];
    const items = [...groups[tKey]].sort((a,b) => (a.inicio||'9999').localeCompare(b.inicio||'9999'));

    const cardsHTML = items.map(m => {
      const sk = getStatusKey(m);
      const bm = STATUS_BADGE_PRINT[sk] || STATUS_BADGE_PRINT.backlog;
      const badge = `<span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:${bm.bg};color:${bm.color};white-space:nowrap;">${bm.label}</span>`;
      const meta = [];
      if (m.dev)     meta.push(`👤 ${m.dev}`);
      if (m.inicio)  meta.push(`📅 Início: ${formatDate(m.inicio)}`);
      if (m.entrega) meta.push(`🏁 Entrega: ${formatDate(m.entrega)}`);
      if (m.estimativa) meta.push(`⏱ ${m.estimativa}`);
      return `<div style="background:#1E1E1C;border:1px solid #2E2E2B;border-radius:8px;padding:12px 14px;margin-bottom:8px;">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:${m.descricao||meta.length?'6px':'0'};">
          <span style="font-size:13px;font-weight:600;color:#ECEAE2;line-height:1.4;">${m.titulo}</span>
          ${badge}
        </div>
        ${m.descricao ? `<div style="font-size:12px;color:#A8A49A;margin-bottom:6px;line-height:1.5;">${m.descricao.substring(0,180)}${m.descricao.length>180?'…':''}</div>` : ''}
        ${meta.length ? `<div style="font-size:11px;color:#6E6A62;display:flex;flex-wrap:wrap;gap:10px;">${meta.map(i=>`<span>${i}</span>`).join('')}</div>` : ''}
      </div>`;
    }).join('');

    return `<div style="margin-bottom:24px;">
      <div style="display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid #2E2E2B;margin-bottom:10px;">
        <span style="width:10px;height:10px;border-radius:50%;background:${cor};flex-shrink:0;display:inline-block;"></span>
        <span style="font-size:13px;font-weight:700;color:#ECEAE2;text-transform:uppercase;letter-spacing:.05em;">${temaNome}</span>
        <span style="font-size:12px;color:#6E6A62;">${items.length} ${items.length===1?'item':'itens'}</span>
      </div>
      ${cardsHTML}
    </div>`;
  }).join('');

  return `<div id="export-canvas" style="background:#0E0E0D;color:#ECEAE2;font-family:'Inter',sans-serif;padding:32px;min-width:800px;width:800px;">
    <div style="border-bottom:1px solid #2E2E2B;padding-bottom:20px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-end;">
      <div>
        <div style="font-size:20px;font-weight:700;color:#ECEAE2;margin-bottom:4px;">🗺️ RoadMap de Melhorias</div>
        <div style="font-size:13px;color:#A8A49A;">Audax Capital · Produto &amp; Tecnologia</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:12px;color:#6E6A62;">${filtroDesc}</div>
        <div style="font-size:11px;color:#6E6A62;margin-top:2px;">Gerado em ${dateStr}</div>
      </div>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px;">
      ${Object.entries(STATUS_BADGE_PRINT).map(([k,v]) => {
        const n = mel.filter(m => getStatusKey(m) === k).length;
        if (!n) return '';
        return `<div style="background:#161614;border:1px solid #2E2E2B;border-radius:8px;padding:8px 14px;text-align:center;">
          <div style="font-size:18px;font-weight:700;color:#ECEAE2;">${n}</div>
          <div style="font-size:11px;color:#A8A49A;margin-top:1px;">${v.label}</div>
        </div>`;
      }).join('')}
    </div>
    ${temasHTML}
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid #2E2E2B;font-size:11px;color:#6E6A62;text-align:center;">
      capfernando.github.io/RoadMap
    </div>
  </div>`;
}

      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <button id="btn-dl-img" onclick="downloadExport('img')" style="font-size:13px;background:#3B8FE8;color:#fff;border:none;border-radius:7px;padding:7px 16px;cursor:pointer;font-weight:600;">⬇ Imagem</button>
        <button id="btn-dl-pdf" onclick="downloadExport('pdf')" style="font-size:13px;background:#9B6FE8;color:#fff;border:none;border-radius:7px;padding:7px 16px;cursor:pointer;font-weight:600;">⬇ PDF</button>
        <button onclick="document.getElementById('export-overlay').remove()" style="font-size:13px;color:#6E6A62;background:none;border:1px solid #2E2E2B;border-radius:7px;padding:7px 14px;cursor:pointer;">✕ Fechar</button>
      </div>
    </div>
    <div style="padding:20px;overflow-x:auto;">
      <div id="export-preview-wrap" style="transform-origin:top left;">
        ${buildReportHTML()}
      </div>
    </div>`;

  overlay.appendChild(panel);
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

  // Scale preview to fit panel
  requestAnimationFrame(() => {
    const wrap = document.getElementById('export-preview-wrap');
    const canvas = document.getElementById('export-canvas');
    if (!wrap || !canvas) return;
    const available = panel.clientWidth - 40;
    const natural = canvas.scrollWidth || 800;
    const scale = Math.min(1, available / natural);
    wrap.style.transform = `scale(${scale})`;
    wrap.style.height = (canvas.scrollHeight * scale) + 'px';
  });
}

async function downloadExport(type) {
  const btnImg = document.getElementById('btn-dl-img');
  const btnPdf = document.getElementById('btn-dl-pdf');
  const btn = type === 'img' ? btnImg : btnPdf;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Gerando…'; }

  const el = document.getElementById('export-canvas');
  if (!el) return;

  try {
    const canvas = await html2canvas(el, {
      backgroundColor: '#0E0E0D',
      scale: 2,
      useCORS: true,
      logging: false,
    });

    const now = new Date();
    const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;

    if (type === 'img') {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `roadmap-audax-${stamp}.png`;
      a.click();
    } else {
      const { jsPDF } = window.jspdf;
      const pxW = canvas.width;
      const pxH = canvas.height;
      const pdfPageW = 210;  // mm A4
      const pdfPageH = 297;  // mm A4
      const mmPerPx = pdfPageW / pxW;
      const pageHeightPx = Math.floor(pdfPageH / mmPerPx);

      const pdf = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });

      let yOffset = 0;
      let pageNum = 0;
      while (yOffset < pxH) {
        if (pageNum > 0) pdf.addPage();
        const sliceH = Math.min(pageHeightPx, pxH - yOffset);
        const sliceCanvas = document.createElement('canvas');
        sliceCanvas.width = pxW;
        sliceCanvas.height = sliceH;
        const ctx = sliceCanvas.getContext('2d');
        ctx.fillStyle = '#0E0E0D';
        ctx.fillRect(0, 0, pxW, sliceH);
        ctx.drawImage(canvas, 0, -yOffset);
        const sliceData = sliceCanvas.toDataURL('image/png');
        pdf.addImage(sliceData, 'PNG', 0, 0, pdfPageW, sliceH * mmPerPx);
        yOffset += sliceH;
        pageNum++;
      }
      pdf.save(`roadmap-audax-${stamp}.pdf`);
    }
  } catch(e) {
    alert('Erro ao gerar exportação. Tente novamente.');
  }

  if (btnImg) { btnImg.disabled = false; btnImg.textContent = '⬇ Imagem'; }
  if (btnPdf) { btnPdf.disabled = false; btnPdf.textContent = '⬇ PDF'; }
}

let _exportTab = 'tema';

function switchExportTab(tab) {
  _exportTab = tab;
  const btnTema = document.getElementById('exp-tab-tema');
  const btnDev  = document.getElementById('exp-tab-dev');
  if (btnTema) {
    btnTema.style.background = tab === 'tema' ? '#3B8FE8' : '#252522';
    btnTema.style.color      = tab === 'tema' ? '#fff'    : '#A8A49A';
    btnTema.style.border     = tab === 'tema' ? 'none'    : '1px solid #2E2E2B';
  }
  if (btnDev) {
    btnDev.style.background = tab === 'dev' ? '#3B8FE8' : '#252522';
    btnDev.style.color      = tab === 'dev' ? '#fff'    : '#A8A49A';
    btnDev.style.border     = tab === 'dev' ? 'none'    : '1px solid #2E2E2B';
  }
  const wrap = document.getElementById('export-preview-wrap');
  const panel = wrap && wrap.closest('[style*="max-width:880px"]');
  if (!wrap) return;
  wrap.innerHTML = tab === 'dev' ? buildDevReportHTML() : buildReportHTML();
  requestAnimationFrame(() => {
    const canvas = document.getElementById('export-canvas');
    if (!canvas || !panel) return;
    const available = panel.clientWidth - 40;
    const natural = canvas.scrollWidth || 800;
    const scale = Math.min(1, available / natural);
    wrap.style.transform = `scale(${scale})`;
    wrap.style.height = (canvas.scrollHeight * scale) + 'px';
  });
}

function buildDevReportHTML() {
  const mel = filtradas();
  const now = new Date();
  const dateStr = now.toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' });

  const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  let filtroDesc = 'Todos os períodos';
  if (_mes !== null && _ano !== null) filtroDesc = `${MESES_PT[_mes - 1]} de ${_ano}`;
  else if (_mes !== null) filtroDesc = MESES_PT[_mes - 1] + ' — todos os anos';
  else if (_ano !== null) filtroDesc = `Ano ${_ano}`;

  // Expandir itens por dev (splitDevs)
  const splitDevs = str => str ? str.split(/[\/,]/).map(s => s.trim()).filter(Boolean) : [];

  const devMap = {};
  mel.forEach(m => {
    const devs = splitDevs(m.dev);
    if (!devs.length) {
      if (!devMap['—']) devMap['—'] = [];
      devMap['—'].push(m);
    } else {
      devs.forEach(d => {
        if (!devMap[d]) devMap[d] = [];
        devMap[d].push(m);
      });
    }
  });

  const devKeys = Object.keys(devMap).sort((a, b) => a === '—' ? 1 : b === '—' ? -1 : a.localeCompare(b));

  const devsHTML = devKeys.map(devName => {
    const items = [...devMap[devName]].sort((a, b) => {
      if (!a.entrega && !b.entrega) return 0;
      if (!a.entrega) return 1;
      if (!b.entrega) return -1;
      return a.entrega.localeCompare(b.entrega);
    });

    const rows = items.map(m => {
      const tema = _temas.find(t => t.id === m.tema_id)?.nome || '—';
      const sk = getStatusKey(m);
      const bm = STATUS_BADGE_PRINT[sk] || STATUS_BADGE_PRINT.backlog;
      const entrega = m.entrega ? formatDate(m.entrega) : '<span style="color:#6E6A62;">Sem previsão</span>';
      const inicio  = m.inicio  ? formatDate(m.inicio)  : '—';
      return `<tr>
        <td style="padding:9px 12px;border-bottom:1px solid #252522;font-size:13px;color:#ECEAE2;font-weight:500;vertical-align:top;">${m.titulo}</td>
        <td style="padding:9px 12px;border-bottom:1px solid #252522;font-size:12px;color:#A8A49A;white-space:nowrap;vertical-align:top;">${tema}</td>
        <td style="padding:9px 12px;border-bottom:1px solid #252522;font-size:12px;color:#A8A49A;white-space:nowrap;vertical-align:top;">${inicio}</td>
        <td style="padding:9px 12px;border-bottom:1px solid #252522;font-size:12px;white-space:nowrap;vertical-align:top;">${entrega}</td>
        <td style="padding:9px 12px;border-bottom:1px solid #252522;vertical-align:top;">
          <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:${bm.bg};color:${bm.color};white-space:nowrap;">${bm.label}</span>
        </td>
      </tr>`;
    }).join('');

    return `<div style="margin-bottom:28px;">
      <div style="display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:2px solid #2E2E2B;margin-bottom:0;">
        <span style="font-size:15px;font-weight:700;color:#ECEAE2;">👤 ${devName}</span>
        <span style="font-size:12px;color:#6E6A62;">${items.length} ${items.length===1?'demanda':'demandas'}</span>
      </div>
      <table style="width:100%;border-collapse:collapse;">
        <thead>
          <tr style="background:#161614;">
            <th style="padding:7px 12px;text-align:left;font-size:11px;font-weight:600;color:#6E6A62;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #2E2E2B;">Demanda</th>
            <th style="padding:7px 12px;text-align:left;font-size:11px;font-weight:600;color:#6E6A62;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #2E2E2B;white-space:nowrap;">Tema</th>
            <th style="padding:7px 12px;text-align:left;font-size:11px;font-weight:600;color:#6E6A62;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #2E2E2B;white-space:nowrap;">Início</th>
            <th style="padding:7px 12px;text-align:left;font-size:11px;font-weight:600;color:#6E6A62;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #2E2E2B;white-space:nowrap;">Entrega</th>
            <th style="padding:7px 12px;text-align:left;font-size:11px;font-weight:600;color:#6E6A62;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #2E2E2B;">Status</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).join('');

  return `<div id="export-canvas" style="background:#0E0E0D;color:#ECEAE2;font-family:'Inter',sans-serif;padding:32px;min-width:800px;width:800px;">
    <div style="border-bottom:1px solid #2E2E2B;padding-bottom:20px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-end;">
      <div>
        <div style="font-size:20px;font-weight:700;color:#ECEAE2;margin-bottom:4px;">👤 Previsão por Desenvolvedor</div>
        <div style="font-size:13px;color:#A8A49A;">Audax Capital · Produto &amp; Tecnologia</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:12px;color:#6E6A62;">${filtroDesc}</div>
        <div style="font-size:11px;color:#6E6A62;margin-top:2px;">Gerado em ${dateStr}</div>
      </div>
    </div>
    ${devsHTML}
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid #2E2E2B;font-size:11px;color:#6E6A62;text-align:center;">
      capfernando.github.io/RoadMap
    </div>
  </div>`;
}
</script>
